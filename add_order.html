{% extends "base.html" %}
{% block content %}
<div class="form-container centered">
    <h2>🛠️ Відкриття нового наряду (виклик процедури)</h2>
    <form method="POST">
        <div class="form-group">
            <label>Оберіть автомобіль:</label>
            <select name="car_id" required>
                {% for c in cars %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Призначити майстра:</label>
            <select name="mechanic_id" required>
                {% for m in mechanics %}
                <option value="{{ m[0] }}">{{ m[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Первинна послуга:</label>
            <select name="service_id" required>
                {% for s in services %}
                <option value="{{ s[0] }}">{{ s[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Скарги клієнта / Примітки:</label>
            <textarea name="notes" rows="3" placeholder="Опишіть проблему..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Створити наряд у БД</button>
    </form>
</div>
{% endblock %}
